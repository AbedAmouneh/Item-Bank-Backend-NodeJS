services:
  postgres:
    image: postgres:16-alpine
    container_name: app-test-postgres
    environment:
      POSTGRES_DB: app_test
      POSTGRES_USER: app_test_user
      POSTGRES_PASSWORD: app_test_password
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_test_user -d app_test']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: app-test-redis
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:3.7.2
    container_name: app-test-localstack
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: eu-west-1
      DEBUG: '0'
    ports:
      - '4566:4566'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 30
